name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    # edited 를 넣는 이유: PR 의 base 를 바꿔도(dev → main) 가드가 그 head 에서 다시 돌아야 한다 — 기본 유형에는
    # 없어서, dev 를 향해 열었다가 main 으로 돌린 PR 은 가드가 "건너뜀" 으로 남은 채 통과한다. edited 는 제목·본문
    # 편집에도 오므로 무거운 잡은 그때 건너뛰고 가드만 다시 돈다.
    types: [opened, synchronize, reopened, edited]
  # 손으로 다시 돌릴 수 있게 — 결과만 보고 싶을 때 빈 커밋을 만들지 않으려고.
  workflow_dispatch:

# 연달아 밀어 넣으면 마지막 것만 돌린다 — 중간 커밋의 실행은 시작 즉시 취소된다.
# (macOS 러너가 특히 느려서, 앞선 커밋들이 줄을 서면 정작 보고 싶은 마지막 결과가 한참 뒤에 나온다.)
# ref 별로 묶으므로(브랜치는 브랜치끼리, PR 은 PR 끼리) main·dev·PR 은 서로 취소하지 않는다. dev 푸시와 열린
# dev→main PR 은 같은 커밋을 두 번 돌리는데, 릴리스 PR 이 열려 있는 짧은 동안뿐이라 감수한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    strategy:
      fail-fast: false
      matrix:
        # macOS 는 뺐다 — 아래 'macos-build' 잡에서 따로 돌리고 전체를 막지는 않는다.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build (all TFMs)
        run: dotnet build --no-restore -c Release
      # 시한과 멈춘-테스트 탐지를 함께 건다. 잡이 밖에서 취소되면 로그가 통째로 사라지지만,
      # 여기서 시한을 넘겨 실패하면 그때까지의 출력이 남고 --long-running 이 어느 테스트가 붙들고 있었는지 이름을 찍는다.
      # 진단 로그를 디스크에 동기로 쓴다 — 프로세스가 시한으로 강제 종료돼도 어디까지 갔는지 파일에 남는다
      # (stdout 은 버퍼에 있다가 종료와 함께 사라져, 12분을 돌고도 한 줄도 건지지 못한 적이 있다).
      # POSIX 쪽은 같은 셸에서 fd 한도를 먼저 올린다 — macOS 는 기본 256 으로 낮아(리눅스는 수만) 소켓을 많이
      # 여는 이 스위트가 한도에 닿을 수 있다. ulimit 은 프로세스에 걸리므로 테스트와 같은 단계에서 올려야 한다.
      - name: Test (in-process simulator)
        if: runner.os != 'Windows'
        shell: bash
        timeout-minutes: 5
        run: |
          ulimit -n 8192 2>/dev/null || ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          echo "fd limit: soft=$(ulimit -Sn) hard=$(ulimit -Hn)"
          dotnet test --no-build -c Release --report-trx --results-directory TestResults --long-running 30 --timeout 4m --diagnostic --diagnostic-output-directory TestResults/diag --diagnostic-synchronous-write --diagnostic-verbosity Debug
        env:
          # 라이브러리 로그를 파일로 받는다 — 강제 종료돼도 마지막으로 시도한 동작(소켓 바인드·레지스터 왕복)이 남는다.
          GEVSHARP_TEST_LOG: TestResults/diag/gevsharp.log
          GEVSHARP_TEST_LOG_LEVEL: Debug
      - name: Test (in-process simulator)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: dotnet test --no-build -c Release --report-trx --results-directory TestResults --long-running 30 --timeout 4m --diagnostic --diagnostic-output-directory TestResults/diag --diagnostic-synchronous-write --diagnostic-verbosity Debug
      # netstandard2.0 자산을 실제로 실행하는 다리 — net48 은 Windows 에서만 복원된다.
      - name: Test (netstandard2.0 asset on .NET Framework)
        if: matrix.os == 'windows-latest'
        timeout-minutes: 5
        run: dotnet test tests/GevSharp.Net48/GevSharp.Net48.csproj -c Release --report-trx --results-directory TestResults --long-running 30 --timeout 4m
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/**/*.trx
            TestResults/diag/**

  # macOS 는 빌드까지만 돌린다. arm64/osx 에서 3 TFM 이 컴파일되는지는 실제로 검증되고, 여기서 깨지면 알아야 한다.
  # 실행(테스트)은 아직 통과시키지 못했다 — 개별 네임스페이스는 전부 11~13초에 통과하는데 전체를 함께 돌리면
  # 스트리밍 테스트에 프레임이 오지 않아 테스트마다 10초 시한을 태운다. 코어 수·fd 한도·정지 경로의 무한 조인은
  # 각각 확인해 배제하거나 고쳤고(조인은 실제 결함이라 고쳤다), 남은 원인은 모른다.
  # "빌드가 깨진다" 와 "실행을 확인하지 못했다" 는 다른 사실이므로 전자만 검사한다.
  macos-build:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build (all TFMs)
        run: dotnet build -c Release

  # 남이 만든 가상 카메라 대향 — 별도 프로세스를 띄워 프로토콜로만 대화한다(링크하지 않는다).
  # 설치 명령의 패키지·실행 파일 이름은 그 배포판이 정한 이름이라 그대로 쓴다.
  virtual-camera:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Install the virtual camera
        run: |
          sudo apt-get update
          sudo apt-get install -y aravis-tools
      - name: Start the virtual camera on loopback
        run: |
          FAKE=$(ls /usr/bin/arv-fake-gv-camera-* | head -1)
          echo "using $FAKE"
          nohup "$FAKE" -i lo > virtual-camera.log 2>&1 &
          sleep 2
          cat virtual-camera.log || true
      - name: Build
        run: dotnet build -c Release
      - name: Integration tests against the virtual camera
        env:
          GEVSHARP_VIRTUAL_CAMERA: "127.0.0.1"
        run: dotnet test --no-build -c Release --filter-trait "Category=VirtualCamera"
      - name: Virtual camera log
        if: always()
        run: cat virtual-camera.log || true

  pack:
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Pack
        run: dotnet pack src/GevSharp/GevSharp.csproj -c Release -o out
      - uses: actions/upload-artifact@v5
        with:
          name: nupkg
          path: out/*.nupkg

  # main 으로 가는 PR(릴리스·핫픽스)의 가드. ① main 의 모든 커밋을 이 브랜치가 담고 있어야 한다 — 핫픽스가 dev 에
  # 병합되지 않은 채 다음 릴리스가 나가면 그 수정이 되돌아간다. ② 판 번호에 -dev 가 남아 있으면 안 된다 — 릴리스 PR 의
  # 마지막 커밋이 그것을 떼는 자리다. PR 의 병합 커밋이 아니라 head 커밋을 검사한다(checkout 기본값은 base 를 합친
  # 임시 병합 커밋이라 main 이 늘 조상으로 보인다).
  release-pr-guard:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: main must be an ancestor of the PR head
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits this branch does not contain — merge main into it first, or a hotfix is lost"
            exit 1
          fi
      - name: The version must not carry the -dev suffix
        shell: bash
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Directory.Build.props || true)
          [ -n "$version" ] || { echo "::error::<Version> not found in Directory.Build.props"; exit 1; }
          echo "Directory.Build.props=$version"
          case "${version,,}" in *-dev*) echo "::error::<Version>$version</Version> still carries -dev — the release PR's last commit drops it"; exit 1;; esac
